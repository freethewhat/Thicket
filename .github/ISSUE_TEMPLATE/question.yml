name: Question / Support
description: Ask how to do something, or report confusing/unclear behavior you're not sure is a bug
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        For feature requests use the Enhancement template; for something
        that's clearly broken use the Bug Report template. Use this one
        when you're not sure which, or just need help.

  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
      description: The outcome you want, not the mechanism you assume is needed.
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Keybindings pressed, commands run, docs/README sections already checked.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output (optional)
      description: Status-line text, terminal output, or a screenshot, if there's something concrete to look at.
    validations:
      required: false
