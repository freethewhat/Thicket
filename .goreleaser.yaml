version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: thicket
    main: ./cmd/thicket
    binary: thicket-bin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: thicket
    builds:
      - thicket
    name_template: "thicket_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - man/thicket.1
      - shell/thicket.bash
      - shell/thicket.zsh
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge pull request"
      - "^Merge branch"

release:
  prerelease: auto
  github:
    owner: freethewhat
    name: Thicket
